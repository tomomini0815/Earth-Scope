<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="globeGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0369a1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Earth Globe Base -->
  <circle cx="32" cy="32" r="28" fill="url(#globeGrad)" filter="url(#glow)" />

  <!-- Latitude Lines -->
  <ellipse cx="32" cy="32" rx="28" ry="12" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.4" fill="none" />
  <ellipse cx="32" cy="32" rx="28" ry="22" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" fill="none" />

  <!-- Longitude Lines -->
  <ellipse cx="32" cy="32" rx="14" ry="28" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.4" fill="none" />
  <line x1="32" y1="4" x2="32" y2="60" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.5" />
  <line x1="4" y1="32" x2="60" y2="32" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.5" />

  <!-- Continents Simplified Silhouette Shapes -->
  <path d="M22 18 C26 16, 36 17, 40 22 C38 28, 30 26, 26 30 C22 26, 20 22, 22 18 Z" fill="#ffffff" fill-opacity="0.85" />
  <path d="M36 34 C42 32, 48 38, 44 44 C38 46, 36 40, 36 34 Z" fill="#ffffff" fill-opacity="0.85" />
  <path d="M18 36 C22 36, 24 42, 20 46 C16 44, 16 38, 18 36 Z" fill="#ffffff" fill-opacity="0.85" />

  <!-- Compass Star / Navigation Pointer (Front Top-Right Accent) -->
  <polygon points="46,10 49,19 58,22 49,25 46,34 43,25 34,22 43,19" fill="#fbbf24" stroke="#ffffff" stroke-width="1" />
  <circle cx="46" cy="22" r="2.5" fill="#ffffff" />
</svg>
